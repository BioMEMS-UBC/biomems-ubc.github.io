{%- comment -%} Click-to-load YouTube video. Usage: {% include youtube.html id="ID" caption="..." %} {%- endcomment -%}
<figure class="video">
  <button type="button" class="video-frame" data-youtube="{{ include.id }}" aria-label="{{ include.title | default: 'Play video' | escape }}">
    <img src="https://i.ytimg.com/vi/{{ include.id }}/hqdefault.jpg" alt="" loading="lazy">
    <span class="video-play">{% include icon.html name="play" %}</span>
  </button>
  {%- if include.caption %}
  <figcaption>{{ include.caption | markdownify | remove: "<p>" | remove: "</p>" }}</figcaption>
  {%- endif %}
</figure>

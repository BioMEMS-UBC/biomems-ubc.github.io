---
layout: default
---
<article>
  <section class="page-hero">
    <div class="container prose">
      <p class="eyebrow"><a href="{{ '/news/' | relative_url }}">News</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
      <h1>{{ page.title }}</h1>
    </div>
  </section>
  <div class="container page-body prose">
    {%- if page.image %}<figure class="figure post-image"><img src="{{ page.image | relative_url }}" alt=""></figure>{% endif %}
    {{ content }}
    <nav class="post-nav">
      {%- if page.previous %}<a href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title }}</a>{% else %}<span></span>{% endif -%}
      {%- if page.next %}<a href="{{ page.next.url | relative_url }}">{{ page.next.title }} &rarr;</a>{% endif -%}
    </nav>
  </div>
</article>

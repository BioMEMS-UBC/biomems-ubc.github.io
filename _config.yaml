# BioMEMS Lab website (custom Jekyll theme)

title: BioMEMS Lab
long_title: Bio-Medical Micro Devices Laboratory
tagline: UBC Electrical and Computer Engineering
description: The Bio-Medical Micro Devices Laboratory at the University of British Columbia builds microfluidic, photonic and microfabricated tools for 3-D cell culture, organs-on-chip, biosensing and cell printing.
lang: en-CA
logo: images/icon.png
image: images/share.jpg

# contact details used in the footer and on the Contact page
contact:
  pi: Prof. Karen Cheung
  email: kcheung@ece.ubc.ca
  phone: 604 827 4114
  room: 146A Brimacombe Building (AMPEL)
  street: 2355 East Mall
  city: Vancouver, BC V6T 1Z4
  country: Canada
  map: https://www.google.com/maps/search/?api=1&query=2355+East+Mall,+Vancouver,+BC+V6T+1Z4

links:
  scholar: https://scholar.google.ca/citations?user=ff8dRzkAAAAJ
  youtube: https://www.youtube.com/playlist?list=PLFpEETyPCgTSJdhBpAsKbH3AR96cyLS7O
  department: https://ece.ubc.ca/

# main navigation, in order
nav:
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/
  - title: Team
    url: /team/
  - title: News
    url: /news/
  - title: Join us
    url: /join/
  - title: Contact
    url: /contact/

# keep old WordPress post URLs (/YYYY/MM/DD/slug/)
permalink: /:year/:month/:day/:title/

collections:
  members:
    output: true
    permalink: /members/:name/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { type: members }
    values: { layout: member }
  - scope: { type: posts }
    values: { layout: post }

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - README.md
  - LICENSE.md
  - Gemfile
  - Gemfile.lock
  - _cite
  - vendor
  - .github

# site properties and page defaults
title: BioMEMS Lab
subtitle: Bio-Medical Micro Devices Laboratory · UBC Electrical and Computer Engineering
description: The Bio-Medical Micro Devices Laboratory at the University of British Columbia builds microfluidic and microfabricated tools for 3-D cell culture, tumour models, imaging and cell printing.
header: images/header.jpg
footer: images/footer.jpg
proofer: false

# site social media and other links (shown in the footer)
links:
  email: kcheung@ece.ubc.ca
  google-scholar: ff8dRzkAAAAJ
  youtube: playlist?list=PLFpEETyPCgTSJdhBpAsKbH3AR96cyLS7O

# keep old WordPress post URLs (/YYYY/MM/DD/slug/)
permalink: /:year/:month/:day/:title/

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - EDITING.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js

name: publish-pages
run-name: Publish generated site to GitHub Pages

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publish the latest generated branch, including retained PR previews.
concurrency:
  group: publish-github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated site
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
